<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1060"><rect width="820" height="1060" fill="#ece3cd"/><rect x="22" y="22" width="776" height="1016" fill="#f6f0df" stroke="#c8b788" stroke-width="2"/><text x="410" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="15" letter-spacing="3" fill="#7a6a45">RÉPUBLIQUE FRANÇAISE — EXTRAIT (SPÉCIMEN)</text><text x="410" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="bold" fill="#2c2517">Acte de mariage</text><text x="410" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#6b5d3e">Tours (Indre-et-Loire) — 1949</text><line x1="72" y1="212" x2="748" y2="212" stroke="#c8b788"/><text x="72" y="262" font-family="Georgia,serif" font-size="20" fill="#3a3226">L'an mil neuf cent quarante-neuf ont comparu</text><text x="72" y="295" font-family="Georgia,serif" font-size="20" fill="#3a3226">Raymond MARTIN, employé des postes, de Tours,</text><text x="72" y="328" font-family="Georgia,serif" font-size="20" fill="#3a3226">et Edith WHITAKER, née à Londres (Angleterre),</text><text x="72" y="361" font-family="Georgia,serif" font-size="20" fill="#3a3226">lesquels ont déclaré se prendre pour époux.</text><text x="410" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="120" fill="#b8462a" opacity="0.12" transform="rotate(-18 410 560)">SPÉCIMEN</text><text x="72" y="1000" font-family="Georgia,serif" font-size="13.5" fill="#8a7a55" font-style="italic">Document fictif — démonstration Arboriane. Aucune valeur légale.</text></svg>